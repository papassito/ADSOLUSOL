name: ADSOLUSOL CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Forensics Audit (junta_medica)
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup Node.js (Web Panel Quality Gate)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Verify root frontend
      shell: pwsh
      run: |
        npm ci
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm run lint
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        npm run build
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify Web Presentation Build
      shell: pwsh
      run: |
        if (Test-Path "src/ADSOLUSOL.Presentation.Web/package.json") {
          cd src/ADSOLUSOL.Presentation.Web; npm ci; npm run build; cd ../..
        }

    - name: Restore Dependencies
      shell: pwsh
      run: dotnet restore ADSOLUSOL.sln

    - name: Compile Solution (Release)
      shell: pwsh
      run: |
        dotnet build ADSOLUSOL.sln -c Release --no-restore -p:IgnoreMissingWorkloads=true -p:WindowsPackageType=None -p:AppxPackage=false -p:GenerateAppxPackageOnBuild=false -p:WindowsAppSDKSelfContained=false -v:minimal /nologo

    - name: Execute Regression & Unit Tests
      shell: pwsh
      run: |
        dotnet test ADSOLUSOL.sln -c Release --no-build -v:minimal --nologo

    - name: Run Forensic Medical Board Audit
      shell: pwsh
      run: |
        ./scripts/audit/junta_medica.ps1 -Root .
      env:
        CI: true

    - name: Upload Clinical Record Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: expediente-clinico-maestro
        path: docs/EXPEDIENTE_CLINICO_MAESTRO.md
        if-no-files-found: warn