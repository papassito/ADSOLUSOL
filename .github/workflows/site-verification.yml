name: Site verification checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/ADSOLUSOL.RegressionTests/**'
      - '.github/workflows/site-verification.yml'
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build API and test domain verification
        run: dotnet test tests/ADSOLUSOL.RegressionTests/ADSOLUSOL.RegressionTests.csproj --filter FullyQualifiedName~SiteVerificationTests --configuration Release --logger "console;verbosity=normal"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
